<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Moraes | Designer Portfolio</title>
    
    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS 4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Framer Motion & React (via CDN para manter a fidelidade das animações) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Poppins", ui-sans-serif, system-ui, sans-serif;
            --font-display: "Bebas Neue", cursive;
            --color-brand: #ff6b00;
            --color-brand-glow: rgba(255, 107, 0, 0.4);
        }

        body {
            @apply bg-[#050505] text-white antialiased overflow-x-hidden;
        }

        .glass-card {
            @apply bg-white/[0.03] border border-white/[0.08] backdrop-blur-2xl rounded-[2rem];
        }

        .orange-gradient-text {
            @apply bg-clip-text text-transparent bg-gradient-to-b from-white to-brand;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 0, 0.3);
            border-radius: 10px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Simulação do ambiente React para funcionar via CDN
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = FramerMotion;

        const GROUPS = [
            {
                name: 'Estratégia Visual',
                images: [
                    'https://i.imgur.com/SagkT0h.png',
                    'https://i.imgur.com/BkGliQT.jpeg',
                    'https://i.imgur.com/gXQWDZb.jpeg',
                    'https://i.imgur.com/WjGQxmx.jpeg'
                ]
            },
            {
                name: 'Feed Estratégico',
                images: [
                    'https://i.imgur.com/ohkAl73.png',
                    'https://i.imgur.com/Kiky0Hi.png',
                    'https://i.imgur.com/G9A3Awm.png',
                    'https://i.imgur.com/zf6MRw0.jpeg'
                ]
            },
            {
                name: 'Narrativas Visuais',
                images: [
                    'https://i.imgur.com/pOCQUe2.jpeg',
                    'https://i.imgur.com/ImqdYXo.jpeg',
                    'https://i.imgur.com/kg30hoR.png',
                    'https://i.imgur.com/WQX8HXB.jpeg'
                ]
            },
            {
                name: 'Ads de Alta Performance',
                images: [
                    'https://i.imgur.com/EhbNvMr.png',
                    'https://i.imgur.com/uMKRS1n.png',
                    'https://i.imgur.com/eQ86kDc.png',
                    'https://i.imgur.com/tLfOJms.png'
                ]
            }
        ];

        function App() {
            const [selectedImage, setSelectedImage] = useState(null);

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="fixed top-0 left-0 w-full z-50 p-6 hidden md:block">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="font-display text-4xl tracking-tighter text-brand">AM</div>
                            <div className="flex gap-8 text-[10px] uppercase tracking-[0.2em] font-bold text-white/50">
                                <a href="#" className="hover:text-white transition-colors">Início</a>
                                <a href="#projects" className="hover:text-white transition-colors">Portfólio</a>
                                <a href="#" className="hover:text-white transition-colors">Sobre</a>
                            </div>
                            <button className="bg-white text-black px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-brand hover:text-white transition-all">
                                Contactar
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative min-h-screen flex flex-col items-center justify-center pt-20 px-6 overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img 
                                src="https://i.imgur.com/ZiNr4s7.png" 
                                className="w-full h-full object-cover object-center opacity-40 md:opacity-100 md:object-right" 
                                alt="Fundo Arthur Moraes"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/40 to-transparent" />
                        </div>

                        <div className="relative z-10 max-w-7xl mx-auto w-full text-center md:text-left">
                            <motion.div 
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md mb-8"
                            >
                                <span className="text-[10px] uppercase tracking-[0.3em] font-bold text-brand">Designer Especialista</span>
                            </motion.div>

                            <motion.h1 
                                initial={{ opacity: 0, x: -50 }}
                                animate={{ opacity: 1, x: 0 }}
                                transition={{ delay: 0.2 }}
                                className="font-display text-7xl md:text-[12rem] leading-[0.8] mb-6 tracking-tighter"
                            >
                                ARTHUR <br/> <span className="text-brand">MORAES</span>
                            </motion.h1>

                            <motion.p 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.4 }}
                                className="max-w-xl text-white/60 text-lg md:text-xl leading-relaxed mb-10"
                            >
                                Transformo estratégias em narrativas visuais de alto impacto. 
                                Especialista em Social Media e Identidade Visual.
                            </motion.p>

                            <div className="flex flex-wrap gap-4 justify-center md:justify-start">
                                <button className="bg-brand text-white px-10 py-4 rounded-full font-bold uppercase tracking-widest hover:scale-105 transition-transform">
                                    Ver Projetos
                                </button>
                                <button className="border border-white/20 backdrop-blur-md px-10 py-4 rounded-full font-bold uppercase tracking-widest hover:bg-white hover:text-black transition-all">
                                    Meus Serviços
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* Projects Grid */}
                    <section id="projects" className="py-32 px-6 max-w-7xl mx-auto">
                        <div className="mb-20 text-center">
                            <h2 className="font-display text-5xl md:text-7xl mb-4">Portfólio Selecionado</h2>
                            <div className="w-20 h-1 bg-brand mx-auto" />
                        </div>

                        <div className="space-y-32">
                            {GROUPS.map((group, idx) => (
                                <div key={idx}>
                                    <h3 className="font-display text-3xl mb-8 tracking-widest text-white/40">{group.name}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {group.images.map((img, i) => (
                                            <motion.div 
                                                key={i}
                                                whileHover={{ y: -10 }}
                                                className="aspect-[4/5] rounded-3xl overflow-hidden cursor-pointer glass-card group relative"
                                                onClick={() => setSelectedImage(img)}
                                            >
                                                <img src={img} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                    <div className="p-4 bg-white/10 backdrop-blur-md rounded-full border border-white/20">
                                                        <i data-lucide="maximize-2" className="w-6 h-6"></i>
                                                    </div>
                                                </div>
                                            </motion.div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-20 border-t border-white/10 text-center">
                        <div className="font-display text-6xl text-white/10 mb-8">ARTHUR MORAES</div>
                        <div className="flex justify-center gap-6 mb-8">
                            <a href="#" className="p-4 rounded-full border border-white/10 hover:border-brand hover:text-brand transition-all"><i data-lucide="instagram"></i></a>
                            <a href="#" className="p-4 rounded-full border border-white/10 hover:border-brand hover:text-brand transition-all"><i data-lucide="linkedin"></i></a>
                            <a href="#" className="p-4 rounded-full border border-white/10 hover:border-brand hover:text-brand transition-all"><i data-lucide="mail"></i></a>
                        </div>
                        <p className="text-white/30 text-xs uppercase tracking-widest">© 2024 Design by AM. Todos os direitos reservados.</p>
                    </footer>

                    {/* Lightbox */}
                    <AnimatePresence>
                        {selectedImage && (
                            <motion.div 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                className="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4 backdrop-blur-xl"
                                onClick={() => setSelectedImage(null)}
                            >
                                <motion.img 
                                    initial={{ scale: 0.9, opacity: 0 }}
                                    animate={{ scale: 1, opacity: 1 }}
                                    src={selectedImage} 
                                    className="max-w-full max-h-[90vh] rounded-2xl shadow-2xl" 
                                />
                                <button className="absolute top-8 right-8 text-white p-2">
                                    <i data-lucide="x" className="w-8 h-8"></i>
                                </button>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        // Renderização e inicialização de ícones
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Timeout para garantir que o React renderizou antes de procurar os ícones
        setTimeout(() => lucide.createIcons(), 500);
    </script>

    <!-- Transpilador Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
